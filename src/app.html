<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<script>
			// A tab left open across a deploy still holds the OLD html, which
			// references the OLD build's content-hashed chunk filenames — once a
			// new deploy replaces those files, any further import from that stale
			// page (including the very entry script that boots the app) 404s.
			// Nothing from the app is running yet to catch that, so this runs
			// first and reloads to fetch the current html/chunks. Rate-limited
			// (by timestamp, not a one-shot flag) so a genuinely broken deploy
			// reloads at most once per 10s instead of looping, while still
			// letting the mechanism fire again for a later, separate incident
			// in the same tab session.
			(function () {
				var RELOAD_KEY = 'stale-chunk-reload-at';
				var CHUNK_ERROR =
					/fetch dynamically imported module|error loading dynamically imported module|importing a module script failed/i;
				function isStaleChunkError(reason) {
					var msg = reason && (reason.message || reason.reason || reason);
					return CHUNK_ERROR.test(String(msg));
				}
				function reloadOnce() {
					try {
						var last = Number(sessionStorage.getItem(RELOAD_KEY) || 0);
						if (Date.now() - last < 10000) return;
						sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
					} catch (err) {
						/* sessionStorage unavailable (private mode, blocked site data): reload anyway */
					}
					location.reload();
				}
				window.addEventListener('unhandledrejection', function (e) {
					if (isStaleChunkError(e.reason)) reloadOnce();
				});
				window.addEventListener('error', function (e) {
					if (isStaleChunkError(e.error || e.message)) reloadOnce();
				});
			})();
		</script>
		<!-- Inline, network-independent: paints the dark ground immediately, before
		     app.css (and the season/day-night classes it keys off) has loaded, so a
		     reload never shows the browser's default white canvas first. The exact
		     shade doesn't matter — every season/night variant is similarly dark —
		     app.css's real `body { background: var(--bg-dark) }` (later in the
		     cascade, so it wins) takes over the instant it's ready. -->
		<style>
			html,
			body {
				background: #07090f;
			}
			:root {
				color-scheme: dark;
			}
		</style>
		<meta
			name="description"
			content="Giuseppe Bellamacina — AI Engineer specialised in LLM-based systems, multi-agent architectures, and Deep Learning models. Working on AI deployments for healthcare and defence organisations."
		/>
		<title>Giuseppe Bellamacina | AI Engineer & Developer</title>
		<link rel="canonical" href="https://giuseppebellamacina.com/" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="%sveltekit.assets%/favicons/favicon-48x48.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="96x96"
			href="%sveltekit.assets%/favicons/favicon-96x96.png"
		/>
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicons/favicon.svg" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicons/apple-touch-icon.png"
		/>
		<meta name="theme-color" content="#000000" />
		<!-- Self-hosted fonts (latin variable subsets) — preloaded, same-origin,
		     font-display: block → no fallback-font flash on reload -->
		<link
			rel="preload"
			href="/fonts/sora-latin-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/outfit-latin-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="stylesheet" href="/fa-subset.css" />
		<!-- Preload hero image (desktop only — on mobile it's smaller priority) -->
		<link
			rel="preload"
			href="https://giuseppebellamacina.com/assets/profile.avif"
			as="image"
			type="image/avif"
			fetchpriority="high"
			media="(min-width: 769px)"
		/>
		<link rel="manifest" href="https://giuseppebellamacina.com/site.webmanifest" />
		<meta property="og:title" content="Giuseppe Bellamacina | AI Engineer & Developer" />
		<meta property="og:site_name" content="giuseppebellamacina.com" />
		<meta
			property="og:description"
			content="Giuseppe Bellamacina — AI Engineer specialised in LLM-based systems, multi-agent architectures, and Deep Learning models. Working on AI deployments for healthcare and defence organisations."
		/>
		<meta property="og:image" content="https://giuseppebellamacina.com/assets/og-card.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Giuseppe Bellamacina, AI Engineer & Developer, with the galaxy from his site and Turi, its voxel mascot"
		/>
		<meta property="og:url" content="https://giuseppebellamacina.com/" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Giuseppe Bellamacina | AI Engineer & Developer" />
		<meta
			name="twitter:description"
			content="AI Engineer specialised in LLM-based systems, multi-agent architectures, and Deep Learning models."
		/>
		<meta name="twitter:image" content="https://giuseppebellamacina.com/assets/og-card.jpg" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "Giuseppe Bellamacina",
				"url": "https://giuseppebellamacina.com/"
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Giuseppe Bellamacina",
				"jobTitle": "AI/ML Engineer",
				"url": "https://giuseppebellamacina.com/",
				"sameAs": [
					"https://github.com/GiuseppeBellamacina",
					"https://www.linkedin.com/in/giuseppe-bellamacina-739b03204/",
					"https://www.instagram.com/giuseppe_bellamacina/"
				]
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Everything in this block runs before first paint so there is never a
			// "default look, then it switches" flash — for the season or the
			// day/night mode. Mirrors dateSeason() in Hero.svelte, seasonStore.ts's
			// calendarSeason() and timeOfDayStore.ts's isDaytime() — keep all in sync.
			(function () {
				var d = new Date();
				var m = d.getMonth();
				var day = d.getDate();
				var season = 'default';
				if ((m === 11 && day === 31) || (m === 0 && day <= 2)) season = 'newyear';
				else if ((m === 11 && day >= 1 && day <= 30) || (m === 0 && day >= 3 && day <= 6))
					season = 'snow';
				else if (m >= 5 && m <= 7) season = 'summer';
				if (season !== 'default') document.body.classList.add('season-' + season);

				// The terminal's day/night override lasts until reload; drop the keys older
				// versions stored it under, so a reload never inherits a forced mode
				try {
					localStorage.removeItem('portfolio-tod-override');
					sessionStorage.removeItem('portfolio-tod-override');
				} catch (e) {
					/* storage blocked: nothing was saved either */
				}
				// Sunrise/sunset for the date in Italy (see isDaytime in timeOfDayStore.ts)
				var rad = Math.PI / 180;
				var doy = Math.floor((d - new Date(d.getFullYear(), 0, 1)) / 864e5) + 1;
				var decl = 23.44 * rad * Math.sin((2 * Math.PI * (284 + doy)) / 365);
				var lat = 42 * rad;
				var halfDay =
					Math.acos(
						(Math.sin(-0.833 * rad) - Math.sin(lat) * Math.sin(decl)) /
							(Math.cos(lat) * Math.cos(decl))
					) /
					rad /
					15;
				var std = Math.max(
					new Date(d.getFullYear(), 0, 1).getTimezoneOffset(),
					new Date(d.getFullYear(), 6, 1).getTimezoneOffset()
				);
				var noon = 12 + 10 / 60 + (std - d.getTimezoneOffset()) / 60;
				var h = d.getHours() + d.getMinutes() / 60;
				var mode = h >= noon - halfDay && h < noon + halfDay ? 'day' : 'night';
				document.body.classList.add('tod-' + mode);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
