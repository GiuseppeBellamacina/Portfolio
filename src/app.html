<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Giuseppe Bellamacina — AI Engineer specialised in LLM-based systems, multi-agent architectures, and Deep Learning models. Working on AI deployments for healthcare and defence organisations."
		/>
		<title>Giuseppe Bellamacina | AI Engineer & Developer</title>
		<link rel="canonical" href="https://giuseppebellamacina.com/" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="%sveltekit.assets%/favicons/favicon-48x48.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="96x96"
			href="%sveltekit.assets%/favicons/favicon-96x96.png"
		/>
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicons/favicon.svg" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicons/apple-touch-icon.png"
		/>
		<meta name="theme-color" content="#000000" />
		<!-- Self-hosted fonts (latin variable subsets) — preloaded, same-origin,
		     font-display: block → no fallback-font flash on reload -->
		<link
			rel="preload"
			href="/fonts/sora-latin-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/outfit-latin-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="stylesheet" href="/fa-subset.css" />
		<!-- Preload hero image (desktop only — on mobile it's smaller priority) -->
		<link
			rel="preload"
			href="https://giuseppebellamacina.com/assets/profile.avif"
			as="image"
			type="image/avif"
			fetchpriority="high"
			media="(min-width: 769px)"
		/>
		<link rel="manifest" href="https://giuseppebellamacina.com/site.webmanifest" />
		<meta property="og:title" content="Giuseppe Bellamacina | AI Engineer & Developer" />
		<meta property="og:site_name" content="Giuseppe Bellamacina" />
		<meta
			property="og:description"
			content="Giuseppe Bellamacina — AI Engineer specialised in LLM-based systems, multi-agent architectures, and Deep Learning models. Working on AI deployments for healthcare and defence organisations."
		/>
		<meta property="og:image" content="https://giuseppebellamacina.com/assets/og-image.png" />
		<meta property="og:url" content="https://giuseppebellamacina.com/" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "Giuseppe Bellamacina",
				"url": "https://giuseppebellamacina.com/"
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Giuseppe Bellamacina",
				"jobTitle": "AI/ML Engineer",
				"url": "https://giuseppebellamacina.com/",
				"sameAs": [
					"https://github.com/GiuseppeBellamacina",
					"https://www.linkedin.com/in/giuseppe-bellamacina-739b03204/",
					"https://www.instagram.com/giuseppe_bellamacina/"
				]
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Apply the seasonal palette before first paint to avoid a default-theme
			// flash during seasonal periods. Mirrors dateSeason() in Hero.svelte — keep in sync.
			(function () {
				var d = new Date();
				var m = d.getMonth();
				var day = d.getDate();
				var season = 'default';
				if ((m === 11 && day === 31) || (m === 0 && day <= 2)) season = 'newyear';
				else if ((m === 11 && day >= 1 && day <= 30) || (m === 0 && day >= 3 && day <= 6))
					season = 'snow';
				else if (m >= 5 && m <= 7) season = 'summer';
				if (season !== 'default') document.body.classList.add('season-' + season);
			})();
			// Apply the day/night class before first paint too. Mirrors
			// hoursToTimeOfDay() in timeOfDayStore.ts — keep in sync.
			(function () {
				var saved = localStorage.getItem('portfolio-tod-override');
				var mode = saved === 'day' || saved === 'night' ? saved : null;
				if (!mode) {
					var h = new Date().getHours();
					mode = h >= 7 && h < 19 ? 'day' : 'night';
				}
				document.body.classList.add('tod-' + mode);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
