<!doctype html>

		<script>
			// A tab left open across a deploy still holds the OLD html, which
			// references the OLD build's content-hashed chunk filenames — once a
			// new deploy replaces those files, any further import from that stale
			// page (including the very entry script that boots the app) 404s.
			// Nothing from the app is running yet to catch that, so this runs
			// first and reloads to fetch the current html/chunks. Rate-limited
			// (by timestamp, not a one-shot flag) so a genuinely broken deploy
			// reloads at most once per 10s instead of looping, while still
			// letting the mechanism fire again for a later, separate incident
			// in the same tab session.
			(function () {
				var RELOAD_KEY = 'stale-chunk-reload-at';
				var CHUNK_ERROR =
					/fetch dynamically imported module|error loading dynamically imported module|importing a module script failed/i;
				function isStaleChunkError(reason) {
					var msg = reason && (reason.message || reason.reason || reason);
					return CHUNK_ERROR.test(String(msg));
				}
				function reloadOnce() {
					var last = Number(sessionStorage.getItem(RELOAD_KEY) || 0);
					if (Date.now() - last < 10000) return;
					sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
					location.reload();
				}
				window.addEventListener('unhandledrejection', function (e) {
					if (isStaleChunkError(e.reason)) reloadOnce();
				});
				window.addEventListener('error', function (e) {
					if (isStaleChunkError(e.error || e.message)) reloadOnce();
				});
			})();
		</script>
		<!-- Inline, network-independent: paints the dark ground immediately, before
		     app.css (and the season/day-night classes it keys off) has loaded, so a
		     reload never shows the browser's default white canvas first. The exact
		     shade doesn't matter — every season/night variant is similarly dark —
		     app.css's real `body { background: var(--bg-dark) }` (later in the
		     cascade, so it wins) takes over the instant it's ready. -->

	<body data-sveltekit-preload-data="hover">
		<script>
			// Everything in this block runs before first paint so there is never a
			// "default look, then it switches" flash — for the season, the
			// day/night mode, OR the random default-mode accent variant below.
			// Mirrors dateSeason() in Hero.svelte, seasonStore.ts's
			// calendarSeason(), timeOfDayStore.ts's computeTimeOfDay(), and
			// defaultVariants.ts's DEFAULT_DAY_VARIANTS — keep all in sync.
			(function () {
				var d = new Date();
				var m = d.getMonth();
				var day = d.getDate();
				var season = 'default';
				if ((m === 11 && day === 31) || (m === 0 && day <= 2)) season = 'newyear';
				else if ((m === 11 && day >= 1 && day <= 30) || (m === 0 && day >= 3 && day <= 6))
					season = 'snow';
				else if (m >= 5 && m <= 7) season = 'summer';
				if (season !== 'default') document.body.classList.add('season-' + season);

				var saved = localStorage.getItem('portfolio-tod-override');
				var mode = saved === 'day' || saved === 'night' ? saved : null;
				if (!mode) {
					var h = d.getHours();
					mode = h >= 7 && h < 19 ? 'day' : 'night';
				}
				document.body.classList.add('tod-' + mode);

				// Default-mode accent variants: one of three is as likely as the
				// original palette — picked here (not in +layout.svelte's onMount)
				// so the choice is already painted on load, never applied after
				// the fact. Only when no season is active and it's day — night
				// always looks the same regardless of which variant this is.
				if (season === 'default' && mode === 'day') {
					var variants = {
						blue: {

							'--secondary-color': '#bec4cf',
							'--accent-color': '#aac0e8',

							'--neon-blue': '#4295fa',
							'--neon-green': '#0ce9a0',
							'--neon-purple': '#bec4cf',

							'--bg-card': '#091120',
							'--bg-main': '#050810',
							'--primary-rgb': '0, 87, 255',
							'--secondary-rgb': '190, 196, 207',
							'--indigo-rgb': '0, 87, 255',
							'--neon-pink-rgb': '62, 26, 255',
							'--neon-blue-rgb': '66, 149, 250',
							'--neon-green-rgb': '12, 233, 160',
							'--bg-dark-rgb': '5, 8, 16',
							'--bg-card-rgb': '9, 17, 32',
							'--gradient-1': 'linear-gradient(135deg, #0038a3 0%, #0057ff 100%)',
							'--gradient-2': 'linear-gradient(135deg, #aac0e8 0%, #0057ff 100%)',
							'--gradient-3': 'linear-gradient(135deg, #0057ff 0%, #bec4cf 100%)',
							'--hero-bg-1': '#050810',
							'--hero-bg-2': '#0c1322',
							'--hero-bg-3': '#101113',
							'--hero-glow-1': 'rgba(0, 87, 255, 0.12)',
							'--hero-glow-2': 'rgba(190, 196, 207, 0.09)',
							'--hero-glow-3': 'rgba(62, 26, 255, 0.06)',
							'--galaxy-c1': '#ffffff',
							'--galaxy-c2': '#dae0e9',
							'--galaxy-c3': '#b4c5e5',
							'--galaxy-c4': '#85a7e9',
							'--galaxy-c5': '#4c86f7',
							'--galaxy-c6': '#3b7bf7',
							'--galaxy-c7': '#4880ea',
							'--galaxy-c8': '#5584dd',
							'--galaxy-c9': '#6288d0',
							'--galaxy-c10': '#6f8cc3',
							'--galaxy-c11': '#7d91b5',
							'--galaxy-c12': '#8a94a8'
						},
						emerald: {
							'--primary-color': '#26fac2',
							'--secondary-color': '#f8e7c9',
							'--accent-color': '#d4fbc2',
							'--neon-pink': '#30ceff',
							'--neon-blue': '#42aafa',
							'--neon-green': '#0ce987',
							'--neon-purple': '#f8e7c9',
							'--bg-dark': '#05100d',
							'--bg-card': '#0a1f19',
							'--bg-main': '#05100d',
							'--primary-rgb': '38, 250, 194',
							'--secondary-rgb': '248, 231, 201',
							'--indigo-rgb': '38, 250, 194',
							'--neon-pink-rgb': '48, 206, 255',
							'--neon-blue-rgb': '66, 170, 250',
							'--neon-green-rgb': '12, 233, 135',
							'--bg-dark-rgb': '5, 16, 13',
							'--bg-card-rgb': '10, 31, 25',
							'--gradient-1': 'linear-gradient(135deg, #04c08e 0%, #26fac2 100%)',
							'--gradient-2': 'linear-gradient(135deg, #d4fbc2 0%, #26fac2 100%)',
							'--gradient-3': 'linear-gradient(135deg, #26fac2 0%, #f8e7c9 100%)',
							'--hero-bg-1': '#05100d',
							'--hero-bg-2': '#0c221c',
							'--hero-bg-3': '#19140b',
							'--hero-glow-1': 'rgba(38, 250, 194, 0.12)',
							'--hero-glow-2': 'rgba(248, 231, 201, 0.09)',
							'--hero-glow-3': 'rgba(48, 206, 255, 0.06)',
							'--galaxy-c1': '#ffffff',
							'--galaxy-c2': '#dfece9',
							'--galaxy-c3': '#c0e8dd',
							'--galaxy-c4': '#9aebd5',
							'--galaxy-c5': '#6cf5d1',
							'--galaxy-c6': '#56faaf',
							'--galaxy-c7': '#54f779',
							'--galaxy-c8': '#61f452',
							'--galaxy-c9': '#92f150',
							'--galaxy-c10': '#c2ee4e',

						},

							'--bg-main': '#090510',
							'--primary-rgb': '106, 0, 244',
							'--secondary-rgb': '255, 214, 165',
							'--indigo-rgb': '106, 0, 244',
							'--neon-pink-rgb': '240, 26, 255',
							'--neon-blue-rgb': '66, 132, 250',
							'--neon-green-rgb': '12, 233, 180',
							'--bg-dark-rgb': '9, 5, 16',
							'--bg-card-rgb': '19, 9, 32',
							'--gradient-1': 'linear-gradient(135deg, #420098 0%, #6a00f4 100%)',
							'--gradient-2': 'linear-gradient(135deg, #9ffacb 0%, #6a00f4 100%)',
							'--gradient-3': 'linear-gradient(135deg, #6a00f4 0%, #ffd6a5 100%)',
							'--hero-bg-1': '#090510',
							'--hero-bg-2': '#150c22',
							'--hero-bg-3': '#1a130a',
							'--hero-glow-1': 'rgba(106, 0, 244, 0.12)',
							'--hero-glow-2': 'rgba(255, 214, 165, 0.09)',
							'--hero-glow-3': 'rgba(240, 26, 255, 0.06)',
							'--galaxy-c1': '#ffffff',
							'--galaxy-c2': '#e0d9e8',
							'--galaxy-c3': '#c7b1e3',
							'--galaxy-c4': '#ac7fe8',
							'--galaxy-c5': '#9143f6',
							'--galaxy-c6': '#3a29ff',
							'--galaxy-c7': '#2b97ff',
							'--galaxy-c8': '#2cffea',
							'--galaxy-c9': '#2eff6f',
							'--galaxy-c10': '#69ff30',
							'--galaxy-c11': '#e3ff31',
							'--galaxy-c12': '#ffa233'
						}
					};
					var keys = Object.keys(variants);
					var choices = [null].concat(keys);
					var picked = choices[Math.floor(Math.random() * choices.length)];
					window.__sessionVariant = picked;
					if (picked) {
						var vars = variants[picked];
						for (var k in vars) {
							if (Object.prototype.hasOwnProperty.call(vars, k)) {
								document.body.style.setProperty(k, vars[k]);
							}
						}
					}
				}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
