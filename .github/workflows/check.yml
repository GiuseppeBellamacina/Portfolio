name: CI

on:
  pull_request:
    paths-ignore:
      - README.md
      - docs/**
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: bun run check
      - name: Check formatting
        run: bun run format:check
      - name: Build
        run: bun run build
